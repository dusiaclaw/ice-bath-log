<!doctype html>
<html lang="en" data-theme="ice" data-mode="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0c1520" id="themecolor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Ice Bath Log</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="lib/leaflet.css">
<script src="lib/leaflet.js"></script>
<style>
:root{--acc:#2aa6e0;--acc2:#5ad1ff;--onacc:#03202f;--red:#ff4d5e;--ok:#3fcf94;--over:#ffb454;--r:18px}
[data-theme=forest]{--acc:#2fa36b;--acc2:#5fd39a;--onacc:#03251a}
[data-theme=sunset]{--acc:#f08a3c;--acc2:#ffb26b;--onacc:#2b1503}
[data-theme=violet]{--acc:#8b6cf0;--acc2:#b3a0ff;--onacc:#150a3a}
[data-theme=rose]{--acc:#e0587a;--acc2:#ff8fa8;--onacc:#3a0a17}
[data-mode=dark]{--bg:#0c1520;--bg2:#13222f;--card:#17293a;--card2:#21394d;--ink:#eaf3fa;--mute:#93aec3;--line:#2a475f;--field:#0f1e2b;--warnbg:#3a2a10;--goodbg:#0f3a2c;color-scheme:dark}
[data-mode=light]{--bg:#eef3f7;--bg2:#e3ecf2;--card:#fff;--card2:#e8eff5;--ink:#0f2230;--mute:#587186;--line:#cfdce6;--field:#f6f9fb;--warnbg:#fff1d6;--goodbg:#dcf5ea;--acc2:var(--acc);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
h1{font-size:22px;margin:4px 0}h2{font-size:16px;margin:0 0 8px;color:var(--acc2)}p{margin:6px 0}
.sub{color:var(--mute);font-size:13px}
svg.ic{width:1.3em;height:1.3em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
#top .t{flex:1;min-width:0}#top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#top .t span{font-size:11px;color:var(--mute)}
#top img.logo{width:34px;height:34px;border-radius:8px;object-fit:cover}
#main{max-width:560px;margin:0 auto;padding:calc(66px + env(safe-area-inset-top)) 14px 24px}
#main.hasbar{padding-bottom:110px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:none;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
#bar.show{display:flex}#bar button{flex:1}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 1px 8px #0003}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.end{justify-content:flex-end}
.big{font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.big small{font-size:24px;color:var(--mute);font-weight:500}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--card2);font-size:13px;border:1px solid transparent}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc2)}.chip.mute{color:var(--mute)}
button,.btn{font:inherit;color:var(--ink);background:var(--card2);border:0;border-radius:14px;padding:12px 16px;cursor:pointer}
button:active{filter:brightness(1.2)}button:disabled{opacity:.5}
button.icon{padding:8px 10px;background:transparent;font-size:18px}
.pri{background:var(--acc);color:var(--onacc);font-weight:700}
.danger{background:var(--red);color:#fff;font-weight:700}
.ghost{background:transparent;border:1px solid var(--line)}
.wide{width:100%}.xl{font-size:20px;padding:18px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px;width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}label.row{color:var(--ink);font-size:15px}
.warn{background:var(--warnbg);border-left:4px solid var(--over);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.good{background:var(--goodbg);border-left:4px solid var(--ok);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.hours{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.hr{min-width:58px;text-align:center;background:var(--card2);border-radius:12px;padding:8px 4px;font-size:13px}.hr b{display:block;font-size:16px}.hr.best{outline:2px solid var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border-radius:14px;padding:10px}.stat b{font-size:22px;display:block}
.hb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;font-weight:600}.hb .ic{font-size:30px;color:var(--acc2)}
.dip{border-top:1px solid var(--line);padding:10px 0}.dip img{width:64px;height:64px;object-fit:cover;border-radius:10px}
pre{background:var(--field);border-radius:10px;padding:10px;font-size:11px;overflow:auto;max-height:220px;white-space:pre-wrap}
.seg{display:flex;background:var(--field);border-radius:12px;overflow:hidden;border:1px solid var(--line)}.seg button{flex:1;border-radius:0;background:none;padding:9px;font-size:14px}.seg button.on{background:var(--acc);color:var(--onacc);font-weight:600}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);margin:8px 0;padding:14px;border-radius:14px}.mi .ic{color:var(--acc2);font-size:22px}.mi span{flex:1}
.pcard{background:var(--card2);border-radius:14px;padding:10px;margin:8px 0}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:var(--ink)}
#spmap{height:280px;border-radius:14px;margin-top:10px;overflow:hidden;position:relative;isolation:isolate;background:var(--card2)}
.logo-lg{width:84px;height:84px;border-radius:18px;object-fit:cover;background:var(--card2)}
.pick{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card2)}.pick.on{outline:2px solid var(--acc)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:99px;z-index:60;font-size:14px;max-width:90%}
#dlg{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end;justify-content:center}#dlg.show{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:18px;color:var(--ink)}.sb{margin:8px 0 14px}.sb ul{padding-left:18px;margin:4px 0}
#menu{position:fixed;top:calc(56px + env(safe-area-inset-top));right:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;z-index:40;display:none;min-width:190px;box-shadow:0 8px 24px #0006;overflow:hidden}#menu.show{display:block}
#menu button{display:flex;gap:10px;align-items:center;width:100%;background:none;border-radius:0;text-align:left}
/* recording overlay */
#rec{--bg:#04182a;--bg2:#0a2a4a;--card:#102a43;--card2:#1d3d5c;--ink:#eaf6ff;--mute:#8fb0c9;--line:#2a475f;--field:#0a1f33;position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:30;display:none;flex-direction:column}
#rec.show{display:flex}#rec.prep{background:#0a2a4a}#rec.dip{background:#04182a}#rec.dip.over{background:#2a1a04}
.rb{flex:1;min-width:0;overflow-x:hidden;overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;flex-direction:column}
.feel{display:flex;gap:6px}.feel button{flex:1 1 0;min-width:0;padding:10px 0;font-size:24px;line-height:1.2}
.rf{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;background:#0006}.rf button{flex:1}
.timer{font-size:min(30vw,26vh);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-2px}
.over .timer{color:var(--over)}
.phase{text-align:center;font-size:22px;font-weight:700;color:var(--acc2);margin-top:6px}.over .phase{color:var(--over)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.stopbtn{height:28vh;font-size:12vw;font-weight:800;margin:0 12px calc(12px + env(safe-area-inset-bottom));border-radius:22px}
.listen{text-align:center;color:var(--mute);font-size:14px;min-height:20px}
.step{display:flex;gap:8px;align-items:center}.step button{width:48px;padding:10px}.step b{flex:1;text-align:center;font-size:20px}
.wzdots{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}.wzdots i{width:26px;height:5px;border-radius:3px;background:var(--card2)}.wzdots i.on{background:var(--acc)}
</style>
</head>
<body>
<div id="top"></div>
<div id="menu"></div>
<div id="main"></div>
<div id="bar"></div>
<div id="rec"></div>
<div id="dlg"></div>

 calls every data source from your phone and shows the exact answer or error.","Settings › Install app on this phone."]},{"v":"1.3","date":"2026-11-08","notes":["Water temperature: the lake model is now linked reliably (the app uses the nearest model point and tells you how far it is); a spot saved without a lake is repaired automatically; measuring stations without temperature data are no longer used."]},{"v":"1.2","date":"2026-11-08","notes":["Swimming spot: a map with a draggable pin (or tap the map) to place your exact spot; weather and lake data follow the pin."]},{"v":"1.1","date":"2026-11-08","notes":["Top bar shows the app name with its version; burger menu stays at the top right."]},{"v":"1.0","date":"2026-11-08","notes":["First release: water and air temperature for your own swimming spot, daily dip suggestions, timed dips with a walk-to-water countdown and voice stop, standing or swimming per person, photos, statistics, optional shared Google Sheet.","First-time setup for club name, logo, city and lake, and members.","Themes, light/dark mode, icon style, backups, license and changelog in Settings. Update pop-up when a new version is available."]}];/*END*/

/* distance (km) from a point to a lake: 0 inside its bounding box (when the data feed supplied one) */
function dl(l,lat,lng){if(l.bbox){const la=Math.min(Math.max(lat,l.bbox[0]),l.bbox[2]),ln=Math.min(Math.max(lng,l.bbox[1]),l.bbox[3]);return km(lat,lng,la,ln)}return km(lat,lng,l.lat,l.lng)}
function parseAlp(j){
  const raw=j.variables.temperature.data.map(x=>Array.isArray(x)?x.flat(Infinity)[0]:x);
  const ts=j.time.map(t=>+new Date(/Z|[+-]\d\d:?\d\d$/.test(t)?t:t+'Z'));
  return ts.map((t,i)=>({t,v:raw[i]})).filter(p=>typeof p.v==='number'&&isFinite(p.v));
}
/* Browsers may not read the Alplakes API (no CORS). An hourly GitHub job publishes
   whole-lake surface grids to the repo's "data" branch; raw.githubusercontent.com allows browser reads. */
const RELAY_BASE=(()=>{const m=location.hostname.match(/^([^.]+)\.github\.io$/),repo=location.pathname.split('/').filter(Boolean)[0];
  return `https://raw.githubusercontent.com/${m?m[1]:'dusiaclaw'}/${m&&repo?repo:'ice-bath-log'}/data/`})();
const RELAY_URL=RELAY_BASE+'index.json';
let relayErr='',relayIdx=null,relayIdxAt=0;const relayLakes={};
async function relayJson(path){const r=await fetch(RELAY_BASE+path+'?t='+Math.floor(Date.now()/3e5),{cache:'no-store'});if(!r.ok)throw new Error(path+': HTTP '+r.status);return r.json()}
async function getIndex(){
  if(relayIdx&&Date.now()-relayIdxAt<15*60e3)return relayIdx;
  try{relayIdx=await relayJson('index.json');relayIdxAt=Date.now();relayErr=''}catch(e){relayErr=e.message||'network error'}
  return relayIdx;
}
/* lake list = lakes of the data feed (all lakes of the Alplakes service) + built-in fallback */
async function loadLakes(){
  const ix=await getIndex();if(!ix||!ix.lakes)return;
  const feed=ix.lakes.map(l=>({name:l.name,keys:[l.key],model:l.model,lat:l.lat,lng:l.lng,bbox:l.bbox}));
  const have=new Set(feed.map(l=>l.keys[0]));
  LAKES=feed.concat(LAKES.filter(l=>!l.keys.some(k=>have.has(k))));
}
async function getRelayLake(key){
  const c=relayLakes[key];if(c&&Date.now()-c.at<15*60e3)return c.d;
  try{const d=await relayJson('lakes/'+key+'.json');relayLakes[key]={d,at:Date.now()};relayErr='';return d}
  catch(e){relayErr=e.message||'network error';return null}
}
async function relayPoint(lakeKeys,lat,lng){
  const ix=await getIndex();if(!ix||!ix.lakes)return null;
  const ent=ix.lakes.find(l=>lakeKeys.includes(l.key));if(!ent)return{missing:true};
  const L=await getRelayLake(ent.key);if(!L)return null;
  let bi=-1,bd=1e9;
  for(let i=0;i<L.lat.length;i++){const dd=km(lat,lng,L.lat[i],L.lng[i]);if(dd<bd){bd=dd;bi=i}}
  if(bi<0)return null;
  const series=L.times.map((t,k)=>({t,v:L.t[k][bi]})).filter(p=>typeof p.v==='number');
  return{key:ent.key,series,dist:bd*1000,gl:L.lat[bi],gn:L.lng[bi],updated:L.updated};
}
let lastAlpErr='';
async function alpPoint(lake,lat,lng,a,b){
  for(const key of lake.keys){
    for(const q of ['?variables=temperature','']){
      try{const r=await fetch(`https://alplakes-api.eawag.ch/simulations/point/${lake.model}/${key}/${a}/${b}/0/${lat.toFixed(5)}/${lng.toFixed(5)}${q}`);
        if(!r.ok){lastAlpErr='HTTP '+r.status;continue}
        const j=await r.json(),s=parseAlp(j);
        if(s.length){lastAlpErr='';return{series:s,key,dist:j.distance&&j.distance.data!=null?+j.distance.data:0,gl:j.lat,gn:j.lng}}
        lastAlpErr='empty answer'}catch(e){lastAlpErr=e.message||'network error'}
    }
  }
  return null;
}
const tfmt=d=>d.toISOString().slice(0,16).replace(/[-:T]/g,'');
// The API always answers with the nearest model grid point and says how far away it is (distance.data, metres).
async function findLakePoint(city,lake){
  const rp=await relayPoint(lake.keys,city.lat,city.lng);
  if(rp&&!rp.missing&&rp.series.length){return rp.dist<=3000?{pt:[rp.gl,rp.gn],key:rp.key,dist:rp.dist/1000}:{far:rp.dist/1000}}
  if(rp&&rp.missing)lastAlpErr=`${lake.name} is not in the app's data feed`;
  const now=Date.now(),a=tfmt(new Date(now-36e5)),b=tfmt(new Date(now+36e5));
  const tries=[[city.lat,city.lng]];for(const f of [.1,.2,.35,.5,.75,1])tries.push([city.lat+(lake.lat-city.lat)*f,city.lng+(lake.lng-city.lng)*f]);
  let best=null;
  for(const [la,ln] of tries){const r=await alpPoint(lake,la,ln,a,b);if(!r)continue;if(!best||r.dist<best.dist)best=r;if(r.dist<=1500)break}
  if(best&&best.dist<=3000)return{pt:[best.gl,best.gn],key:best.key,dist:best.dist/1000};
  return best?{far:best.dist/1000}:null;
}
let stationsFeed=null,stationsAt=0;
async function getStations(){
  if(stationsFeed&&Date.now()-stationsAt<15*60e3)return stationsFeed;
  try{stationsFeed=await relayJson('stations.json');stationsAt=Date.now()}catch(e){relayErr=e.message||'network error'}
  return stationsFeed;
}
async function nearestStation(lat,lng){
  const d=await getStations();if(!d||!d.stations)return null;
  let best=null;for(const s of d.stations){const dd=km(lat,lng,s.lat,s.lng);if(dd<40&&(!best||dd<best.dist))best={id:s.id,name:s.name,dist:Math.round(dd),ok:true}}
  return best;
}

async function fetchAlp(){
  const sp=S.settings.spot;if(!sp||!sp.lake||!sp.pt)throw new Error('no lake model set');
  const now=Date.now();let r=await relayPoint([sp.lake.key],sp.pt[0],sp.pt[1]);
  if(!r||r.missing||!r.series.length)r=await alpPoint({keys:[sp.lake.key],model:sp.lake.model},sp.pt[0],sp.pt[1],tfmt(new Date(now-6*36e5)),tfmt(new Date(now+48*36e5)));
  if(!r)throw new Error(relayErr?'data feed: '+relayErr:(lastAlpErr||'no model data'));
  let cur=r.series[0];for(const p of r.series)if(Math.abs(p.t-now)<Math.abs(cur.t-now))cur=p;
  return{v:+cur.v.toFixed(1),t:cur.t,series:r.series.filter(p=>p.t>now-36e5).slice(0,60)};
}
async function fetchBafu(){
  const sp=S.settings.spot,st=sp&&sp.station;if(!st)throw new Error('no station near your spot');
  const d=await getStations();if(!d||!d.stations)throw new Error('data feed: '+(relayErr||'unavailable'));
  const s=d.stations.find(x=>x.id===st.id);if(!s)throw new Error('station has no temperature now');

async function refreshData(){
  if(loading||!S.settings.spot)return;loading=true;render();
  try{await healSpot()}catch{}
  const [a,b,w]=await Promise.allSettled([fetchAlp(),fetchBafu(),fetchWx()]);
  const c=S.cache;c.errors={};
  if(a.status==='fulfilled')c.alp=a.value;else{c.errors.alp=a.reason.message;delete c.alp}
  if(b.status==='fulfilled')c.bafu=b.value;else{c.errors.bafu=b.reason.message;delete c.bafu}
  if(w.status==='fulfilled')c.wx=w.value;else c.errors.wx=w.reason.message;
  c.fetched=Date.now();save();loading=false;render();
}
const WSRC=[['auto','Automatic','Lake model first, then a nearby measuring station'],['model','Lake model only','Alplakes simulation for your spot'],['station','Measuring station only','Nearest BAFU lake station with a temperature'],['avg','Average of both','Mean of lake model and station when both exist'],['manual','Typed by hand only','Only the value you enter on Conditions']];
function waterReadings(){const {alp,bafu}=S.cache,m=S.manual;return{model:alp?{v:alp.v,t:alp.t}:null,station:bafu?{v:bafu.v,t:bafu.t}:null,manual:m?{v:m.v,t:m.t}:null}}
function waterNow(){
  const mode=S.settings.waterSource||'auto',m=S.manual,{model:A,station:B}=waterReadings();
  const man=m&&(mode==='manual'||Date.now()-m.t<6*36e5)?{v:m.v,src:'Your measurement',t:m.t}:null;
  if(mode==='manual')return man;
  if(man)return man;
  const a=A&&{v:A.v,src:'Lake model',t:A.t},b=B&&{v:B.v,src:'Measuring station',t:B.t};
  if(mode==='model')return a||null;
  if(mode==='station')return b||null;
  if(mode==='avg')return a&&b?{v:+((a.v+b.v)/2).toFixed(1),src:'Average of lake model and station',t:Math.min(a.t,b.t)}:(a||b||null);
  return a||b||null;
}

/* ====== suggestions ====== */
const recommendSec=w=>w==null?120:Math.round(Math.min(Math.max(w,1),10))*60;
function suggestion(){
  const w=waterNow(),wx=S.cache.wx,out=[];
  if(!w)return{lines:[{c:'warn',t:'No water temperature yet – refresh, or enter what you measure at the shore.'}],sec:120};
  const sec=recommendSec(w.v),min=sec/60,lvl=w.v<4?'Extreme cold':w.v<7?'Very cold':w.v<10?'Cold':w.v<14?'Fresh':'Mild';
  out.push({c:'good',t:`<b>${lvl} (${w.v.toFixed(1)}°C)</b> – aim for up to <b>${min} min</b> (rule of thumb: ~1 min per °C, max 10). `+(w.v<7?'Stay standing or swim only briefly; keep hands and head out if you can.':w.v<12?'Short swims are fine if you are acclimatised.':'Good conditions for a longer, relaxed dip.')});
  if(wx){
    if(wx.feels<3)out.push({c:'warn',t:`Feels like ${wx.feels.toFixed(0)}°C on shore – bring warm dry layers, a hat and a hot drink; get dressed fast.`});
    if(wx.wind>20)out.push({c:'warn',t:`Wind ${Math.round(wx.wind)} km/h – wind chill after you get out will hurt; shorten the dip.`});
    if(wx.code>=95)out.push({c:'warn',t:'Thunderstorm risk – stay out of the water.'});
    else if(wx.code>=51&&wx.code<=82)out.push({c:'warn',t:'Rain/snow around – plan a sheltered place to change.'});
    if(!wx.day)out.push({c:'warn',t:'It is dark – use a headlamp, bring a buddy, stay close to the shore.'});
    const b=bestHour();if(b)out.push({c:'good',t:`Best slot ${b.today?'today':'tomorrow'}: <b>${pad(new Date(b.t).getHours())}:00</b> – feels like ${b.feels.toFixed(0)}°C, ${wxIcon(b.code)} ${b.pop??0}% rain chance.`});
  }
  out.push({c:'warn',t:'Never dip alone. Leave the water if you shiver uncontrollably or lose feeling in hands. Rewarm gradually (no hot shower right away). Not medical advice.'});
  return{lines:out,sec};
}
function bestHour(){
  const h=S.cache.wx?.hours;if(!h)return null;const now=Date.now(),d=new Date();
  const ok=x=>{const hr=new Date(x.t).getHours();return hr>=8&&hr<=17&&x.code<95&&(x.pop??0)<60};
  let c=h.filter(x=>x.t>now-36e5&&new Date(x.t).getDate()===d.getDate()&&ok(x)),today=true;
  if(!c.length){c=h.filter(x=>x.t>now&&ok(x));today=false}
  if(!c.length)return null;c.sort((a,b)=>b.feels-a.feels);return{...c[0],today};
}

function allRows(scope){const m=new Map();if(scope==='club')for(const c of S.club)m.set(String(c.key),{key:String(c.key),dipId:String(c.dipId),ts:+c.timestamp,name:String(c.name),sec:+c.seconds,style:c.style,water:c.waterC===''?null:+c.waterC,air:c.airC===''?null:+c.airC,feeling:c.feeling});for(const r of localRows())m.set(r.key,r);return[...m.values()].sort((a,b)=>a.ts-b.ts)}

  return `<div class="seg" style="margin:8px 0"><button class="${statScope==='mine'?'on':''}" data-a="scope" data-v="mine">This phone</button><button class="${statScope==='club'?'on':''}" data-a="scope" data-v="club">Whole club (Sheet)</button></div>

  ${per.map(p=>`<tr><td>${esc(p.n)}</td><td>${p.c}</td><td>${fmt(p.tot)}</td><td>${fmt(p.max)}</td><td>${p.cold==null?'–':p.cold.toFixed(1)+'°'}</td><td>${p.sw}</td></tr>`).join('')}</table><div class="sub">Last column: swims (not just standing).</div></div>`}`;
}
function chart(d){
  if(!d.length)return '';const W=340,H=150,L=8,B=22,T=10,n=d.length,bw=Math.max(4,Math.min(26,(W-2*L)/n-3));
  const mx=Math.max(60,...d.map(x=>x.sec)),ws=d.filter(x=>x.water!=null).map(x=>x.water),lo=Math.min(...ws,0)-1,hi=Math.max(...ws,10)+1;
  const x=i=>L+(i+.5)*((W-2*L)/n),yb=s=>H-B-(s/mx)*(H-B-T),yw=w=>H-B-((w-lo)/(hi-lo))*(H-B-T);
  const bars=d.map((q,i)=>`<rect x="${x(i)-bw/2}" y="${yb(q.sec)}" width="${bw}" height="${H-B-yb(q.sec)}" rx="2" fill="var(--acc)" opacity=".75"/>`).join('');
  const pts=d.map((q,i)=>q.water==null?null:[x(i),yw(q.water)]).filter(Boolean);
  const line=pts.length?`<polyline fill="none" stroke="var(--over)" stroke-width="2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="var(--over)"/>`).join(''):'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dips chart">${bars}${line}<text x="${L}" y="${H-6}" fill="var(--mute)" font-size="10">${fmtDate(d[0].ts)}</text><text x="${W-L}" y="${H-6}" fill="var(--mute)" font-size="10" text-anchor="end">${fmtDate(d[n-1].ts)}</text><text x="${L}" y="${T}" fill="var(--mute)" font-size="10">${Math.round(mx/60)} min</text></svg>`;
}
function lineChart(list,o={}){
  const W=340,H=o.h||150,L=34,R=8,T=10,B=22,all=list.flatMap(s=>s.pts).filter(p=>p.v!=null);if(all.length<2)return '<div class="sub">Not enough data.</div>';
  const t0=Math.min(...all.map(p=>p.t)),t1=Math.max(...all.map(p=>p.t));let lo=Math.min(...all.map(p=>p.v)),hi=Math.max(...all.map(p=>p.v));if(hi-lo<1){lo-=.5;hi+=.5}const pd=(hi-lo)*.1;lo-=pd;hi+=pd;
  const x=t=>L+(t-t0)/(t1-t0||1)*(W-L-R),y=v=>H-B-(v-lo)/(hi-lo)*(H-B-T);
  const grid=[0,.5,1].map(f=>{const v=lo+(hi-lo)*f;return `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${y(v)+3}" fill="var(--mute)" font-size="10" text-anchor="end">${v.toFixed(1)}</text>`}).join('');
  const ticks=[0,1,2,3].map(i=>{const t=t0+(t1-t0)*i/3,d=new Date(t);return `<text x="${x(t)}" y="${H-6}" fill="var(--mute)" font-size="10" text-anchor="${i===0?'start':i===3?'end':'middle'}">${d.toLocaleDateString('en-GB',{weekday:'short'})} ${pad(d.getHours())}h</text>`}).join('');
  const lines=list.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linejoin="round" points="${s.pts.filter(p=>p.v!=null).map(p=>x(p.t).toFixed(1)+','+y(p.v).toFixed(1)).join(' ')}"/>`).join('');
  const nowX=Date.now()>=t0&&Date.now()<=t1?`<line x1="${x(Date.now())}" x2="${x(Date.now())}" y1="${T}" y2="${H-B}" stroke="var(--mute)" stroke-dasharray="3 3"/>`:'';
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(o.label||'Chart')}">${grid}${nowX}${lines}${ticks}</svg>`+(list.length>1?`<div class="row wrap sub">${list.map(s=>`<span><span style="color:${s.color}">●</span> ${esc(s.name)}</span>`).join('')}</div>`:'');
}

function forecastTxt(s){const now=Date.now();const pick=h=>{const t=now+h*36e5;return s.reduce((a,p)=>Math.abs(p.t-t)<Math.abs(a.t-t)?p:a)};return [6,24,48].map(h=>`+${h}h ${pick(h).v.toFixed(1)}°`).join(' · ')}
function hoursHtml(wx){const now=Date.now(),b=bestHour();return `<div class="hours" style="margin-top:10px">${wx.hours.filter(h=>h.t>now-36e5).slice(0,12).map(h=>`<div class="hr ${b&&b.t===h.t?'best':''}">${pad(new Date(h.t).getHours())}h<b>${h.feels.toFixed(0)}°</b>${wxIcon(h.code)}<br><span class="sub">${h.pop??0}%</span></div>`).join('')}</div>`}

  }else if(k==='sound'){

async function diagFetch(label,url){
  const t=Date.now();let out=label+'\n  '+url.replace(/^https:\/\//,'').slice(0,100)+'\n';
  try{const r=await fetch(url,{cache:'no-store'});const tx=await r.text();out+=`  -> HTTP ${r.status} in ${Date.now()-t} ms\n  ${tx.replace(/\s+/g,' ').slice(0,200)}\n`}
  catch(e){out+=`  FAILED ${e.name}: ${e.message} (${Date.now()-t} ms)\n`;
    try{await fetch(url,{mode:'no-cors',cache:'no-store'});out+='  (server reachable, but it does not allow this web page to read the answer = CORS)\n'}catch(e2){out+='  (server not reachable at all: '+e2.message+')\n'}}
  return out+'\n';
}

let ac;
function beep(f=880,d=.15){if(!S.settings.beep)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.6,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d+.02)}catch{}}

let recog=null,listening=false,onHeard=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const kwList=()=>S.settings.keywords.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
function matchKw(txt){txt=txt.toLowerCase();const toks=txt.split(/[^a-zäöüéèàß]+/).filter(Boolean);return kwList().some(k=>k.includes(' ')?txt.includes(k):toks.includes(k))}
function listen(cb,el){
  if(!SR){if(el)el.textContent='⚠️ Voice recognition not supported – use the STOP button';return false}
  stopListen();listening=true;onHeard=cb;
  const start=()=>{recog=new SR();recog.lang=S.settings.lang;recog.continuous=true;recog.interimResults=true;recog.maxAlternatives=3;
    recog.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++){const t=e.results[i][j].transcript;if(el)el.textContent='🎙 heard: “'+t.trim().slice(-30)+'”';if(listening&&matchKw(t)){onHeard&&onHeard(t);return}}};
    recog.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;if(el)el.textContent='⚠️ Voice recognition was refused ('+e.error+'). The microphone itself is allowed, so the phone\'s speech service blocks this app – try opening the app in Chrome instead of the installed icon, or use the STOP button.'}else if(e.error==='network'){if(el)el.textContent='⚠️ Voice recognition needs an internet connection'}};
    recog.onend=()=>{if(listening)setTimeout(()=>{try{start()}catch{}},120)};
    try{recog.start();if(el&&!el.textContent)el.textContent='🎙 listening for “'+kwList().join('” / “')+'”'}catch{}};
  const mine=cb;
  (async()=>{
    // Ask for the microphone first: this is what makes Chrome show the permission prompt
    if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia){
      try{if(el)el.textContent='🎙 asking for microphone…';const st=await navigator.mediaDevices.getUserMedia({audio:true});st.getTracks().forEach(t=>t.stop());if(el)el.textContent=''}
      catch(err){if(onHeard===mine){listening=false;if(el)el.textContent=(err&&(err.name==='NotAllowedError'||err.name==='SecurityError'))?'⚠️ Microphone is blocked for this app. Open Settings › Permissions & tests for how to switch it on, or use the STOP button.':'⚠️ No microphone available ('+((err&&err.name)||'error')+') – use the STOP button'}return}
    }
    if(onHeard===mine&&listening)start();
  })();
  return true;
}
function stopListen(){listening=false;onHeard=null;try{recog&&(recog.onend=null,recog.abort())}catch{}recog=null}

  <div class="card"><label style="margin-top:0">Time in the water (mm:ss)</label><input id="w_dur" value="${fmt(R.durationSec)}">
   <label>Water temperature (°C)</label><input id="w_water" inputmode="decimal" value="${R.water??''}">
   <label>Air temperature (°C)</label><input id="w_air" inputmode="decimal" value="${R.air!=null?R.air.toFixed(1):''}"></div>
  <div class="card"><h2>Per person</h2>${R.people.map((n,i)=>`<div class="pcard"><b>${esc(n)}</b>
   <div class="seg" style="margin:6px 0"><button data-a="sty" data-v="${i}|standing" class="${R.styles[i]==='standing'?'on':''}">Standing</button><button data-a="sty" data-v="${i}|swimming" class="${R.styles[i]==='swimming'?'on':''}">Swimming</button></div>
   <input class="w_own" data-i="${i}" placeholder="Own time if different (mm:ss)" value="${esc(R.own&&R.own[i]||'')}"></div>`).join('')}</div>
  <div class="card"><label style="margin-top:0">How did it feel?</label><div class="feel">${[1,2,3,4,5].map(n=>`<button class="${R.feeling===n?'pri':''}" data-a="feel" data-v="${n}">${['🥶','😬','🙂','😄','🤩'][n-1]}</button>`).join('')}</div>
   <label>Notes</label><textarea id="w_notes" rows="2" placeholder="Sunny, calm, 5 swans…">${esc(R.notes||'')}</textarea>
   <label>Photo of the lake</label><div class="row"><label class="btn" style="margin:0;color:var(--ink)">${ic('camera')} Take / choose photo<input id="w_photo" type="file" accept="image/*" capture="environment" hidden></label><span class="sub">${R.photo?'photo added ✓':''}</span></div>
   ${R.photoUrl?`<img src="${R.photoUrl}" style="width:100%;border-radius:12px;margin-top:8px" alt="">`:''}</div></div>
  <div class="rf"><button class="ghost" data-a="recDiscard">Discard</button><button class="pri" data-a="recSave">${ic('device-floppy')} Save dip</button></div>`;
}
function startPrep(){
  R.phase='prep';R.prepStart=Date.now();persistR();ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();lock();showRec();cueMark=null;say('Get in position');
  stopTick();tick=setInterval(doTick,200);doTick();
}
function startDip(){
  R.phase='dip';R.dipStart=Date.now();R.targetHit=false;persistR();showRec();cueMark=null;beep(1200,.5);say('Go');
  const st=$('#lst');setTimeout(()=>{if(R&&R.phase==='dip')listen(()=>stopDip(),st)},1500);
  stopTick();tick=setInterval(doTick,200);doTick();
}
function doTick(){
  if(!R)return;const tm=$('#tm');if(!tm)return;const now=Date.now();
  if(R.phase==='prep'){
    const rem=R.prepSec-(now-R.prepStart)/1000;if(rem<=0){startDip();return}
    const c=Math.ceil(rem);tm.textContent=fmt(c);
    if(cueMark!==c){cueMark=c;if(c<=5)beep(c<=1?1000:700,.12);if(c===10||c===30)say(String(c))}
  }else if(R.phase==='dip'){
    const el=(now-R.dipStart)/1000,over=el>=R.targetSec;
    recEl().classList.toggle('over',over);tm.textContent=over?'+'+fmt(el-R.targetSec):fmt(R.targetSec-el+.999);
    const ph=$('#ph');if(ph)ph.textContent=over?'Overtime – stay as long as you want':'In the water';
    const tot=$('#tot');if(tot)tot.textContent='Total '+fmt(el);
    if(over&&!R.targetHit){R.targetHit=true;beep(1000,.6);say('Target reached')}
    const left=Math.ceil(R.targetSec-el);if(!over&&cueMark!==left){cueMark=left;if(left===10||left===5)beep(800,.1)}
  }
}
function stopDip(){
  if(!R||R.phase!=='dip')return;
  R.dipEnd=Date.now();R.durationSec=Math.round((R.dipEnd-R.dipStart)/1000);R.phase='wrap';R.styles=R.people.map(n=>S.settings.lastStyle[n]||'standing');R.own={};
  stopTick();stopListen();unlock();beep(600,.4);persistR();showRec();
}
function keepWrap(){if(!$('#w_dur'))return;const p=parseMS($('#w_dur').value);if(p)R.durationSec=p;R.water=num($('#w_water').value);R.air=num($('#w_air').value);R.notes=$('#w_notes').value;R.own=R.own||{};document.querySelectorAll('.w_own').forEach(i=>R.own[i.dataset.i]=i.value)}
async function saveRec(){
  keepWrap();const dur=parseMS($('#w_dur').value);if(!dur){toast('Enter a valid time');return}
  const own={};document.querySelectorAll('.w_own').forEach(i=>{const s=parseMS(i.value);if(s)own[i.dataset.i]=s});
  const id=uid(),d={id,ts:R.dipStart,durationSec:dur,water:R.water,air:R.air,waterSrc:R.waterSrc,wind:R.wind,feeling:R.feeling||0,notes:(R.notes||'').trim(),people:R.people.map((n,i)=>({name:n,style:R.styles[i],sec:own[i]||dur})),hasPhoto:false,synced:false};
  R.people.forEach((n,i)=>S.settings.lastStyle[n]=R.styles[i]);
  if(R.photo){try{await photoPut(id,R.photo);d.hasPhoto=true}catch{toast('Photo could not be saved')}}
  S.dips.push(d);save();toast('Dip saved ✓');hideRec();go('stats');
  if(S.settings.sheetUrl)sync();
}

/* ====== events ====== */
document.addEventListener('click',async ev=>{
  if(menuOpen&&!ev.target.closest('#menu')&&!ev.target.closest('[data-a=menu]')){menuOpen=false;renderTop()}
  const t=ev.target.closest('[data-a]');if(!t)return;ev.preventDefault();const a=t.dataset.a,v=t.dataset.v,s=S.settings;
  switch(a){
    case'back':back();break;
    case'menu':menuOpen=!menuOpen;renderTop();break;
    case'go':go(v);break;
    case'sub':go('settings',v);break;
    case'gospot':go('settings','spot');break;
    case'savepage':savePage();break;
    case'refresh':refreshData();break;
    case'manual':{const x=num($('#man').value);if(x==null){toast('Enter a number');break}S.manual={v:x,t:Date.now()};save();render();break}
    case'manualClear':S.manual=null;save();render();break;
    case'updatepop':updatePop();break;
    case'chkupd':checkUpdate(true);break;
    case'install':if(deferredInstall){deferredInstall.prompt();deferredInstall=null;render()}break;
    case'changelog':infoD('Changelog',changelogHtml(CHANGELOG));break;
    case'license':infoD('License',`<p><b>${APP_NAME}</b> is free software under the <b>GNU General Public License v3.0</b>.</p><p class="sub">You may use, study, share and modify it. If you distribute it or a modified version, you must keep it under the same license and make the source code available. There is no warranty. The full license text is in the LICENSE file of the project and at gnu.org/licenses/gpl-3.0.</p>`);break;
    case'privacy':infoD('Privacy & data sources',`<p>All dips, members, photos and settings stay on this phone. There are no accounts, ads or tracking.</p><p>Only if you set it up: dips (names, times, temperatures, notes – not photos) are sent to <b>your own</b> Google Sheet.</p><p class="sub">Services contacted: Open-Meteo (place search and weather), Alplakes by EPFL/Eawag (lake model temperature), existenz.ch (BAFU measuring stations), and Google Apps Script for your sheet. They receive your city’s coordinates, not your name. Voice recognition is done by Chrome’s speech service.</p>`);break;
    case'credits':infoD('Credits',`<ul><li>Icons: Tabler Icons (MIT)</li><li>Map: Leaflet (BSD-2) with © OpenStreetMap contributors</li><li>Weather and place search: Open-Meteo</li><li>Lake temperature: Alplakes (EPFL, Eawag), simulated data, republished hourly by the repo’s GitHub job</li><li>Measuring stations: BAFU via existenz.ch</li></ul>`);break;
    /* wizard & spot */
    case'wback':wizRead();if(W.step>0){W.step--;render()}break;
    case'wnext':wizNext();break;
    case'wadd':{const n=$('#w_newm').value.trim();wizRead();if(n&&!W.members.includes(n)&&n!==W.me){W.members.push(n);render()}break}
    case'wdel':wizRead();W.members=W.members.filter(m=>m!==v);render();break;
    case'geo':spotGeo();break;
    case'pickcity':dirty=true;spotPickCity(+v);break;
    case'picklake':dirty=true;spotPickLake(+v);break;
    /* settings */
    case'rmlogo':s.club.logo='';save();render();break;
    case'theme':s.theme=v;save();render();break;
    case'mode':s.mode=v;save();render();break;
    case'iconstyle':s.iconStyle=v;save();render();break;
    case'me':s.me=v;save();render();break;
    case'addmember':{const n=$('#newm').value.trim();if(n&&!S.members.includes(n)){S.members.push(n);if(!s.me)s.me=n;save();render()}break}
    case'delmember':if(await confirmD('Remove member',`Remove ${esc(v)} from the list? Past dips are kept.`,'Remove','Cancel',true)){S.members=S.members.filter(m=>m!==v);save();render()}break;
    case'tmode':readDips();s.targetMode=v;dirty=true;render();break;
    case'testvoice':{readDips();const el=$('#vtest');el.textContent='';stopListen();listen(()=>{stopListen();el.textContent='✅ Keyword recognised!'},el);setTimeout(()=>{if(listening){stopListen();el.textContent+=' (test ended)'}},15000);break}
    case'rundiag':runDiag();break;
    case'wsrc':s.waterSource=v;save();render();break;
    case'permallow':permAllow(v);break;
    case'permtest':permTest(v);break;
    case'permall':permAll();break;
    case'adv':go('adv');break;
    case'copydiag':try{await navigator.clipboard.writeText($('#diagout').textContent);toast('Copied')}catch{toast('Select the text and copy manually')}break;
    case'installapp':{
      if(matchMedia('(display-mode: standalone)').matches||navigator.standalone){infoD('Already installed','This app is already installed on your phone.');break}
      if(deferredInstall){deferredInstall.prompt();try{await deferredInstall.userChoice}catch{}deferredInstall=null;render();break}
      infoD('Install on this phone','<ol><li>Open this page in Chrome.</li><li>Tap the ⋮ menu at the top right.</li><li>Choose <b>Install app</b> (or <b>Add to Home screen</b>).</li></ol><p class="sub">Chrome shows its own install button only after the page has been open for a short while; if you dismissed it before, the menu always works.</p>');break}
    case'sync':s.sheetUrl=$('#s_sheet').value.trim();save();sync();break;
    case'copyscript':try{await navigator.clipboard.writeText(APPS_SCRIPT);toast('Script copied')}catch{toast('Select the text and copy manually')}break;
    case'csv':{const h=['dipId','date','time','name','seconds','style','waterC','airC','feeling'];download('ice-bath-log.csv',[h.join(',')].concat(allRows('club').map(r=>[r.dipId,new Date(r.ts).toLocaleDateString('en-CA'),fmtTime(r.ts),r.name,r.sec,r.style,r.water??'',r.air??'',r.feeling??''].map(csvEsc).join(','))).join('\n'),'text/csv');break}
    case'json':download('ice-bath-log-backup.json',JSON.stringify({members:S.members,dips:S.dips,settings:S.settings}),'application/json');break;
    case'import':$('#impfile').click();break;
    case'erase':if(await confirmD('Erase everything?','All dips, members and settings on this phone will be deleted. Rows already in the Sheet stay there. This cannot be undone.','Erase all','Cancel',true)){localStorage.removeItem(LS);localStorage.removeItem(ACTIVE);try{indexedDB.deleteDatabase('ice-bath-log-photos')}catch{}location.reload()}break;
    case'scope':statScope=v;render();break;
    case'deldip':if(await confirmD('Delete dip','Delete this dip from this phone? Rows already in the Sheet stay there.','Delete','Cancel',true)){S.dips=S.dips.filter(d=>d.id!==v);photoDel(v);save();render()}break;
    /* recording */
    case'recNew':if(!S.members.length){toast('Add members in Settings first');go('settings','members');break}newRec();break;
    case'recCancel':if(await confirmD('Cancel this dip?','Nothing will be saved.','Cancel dip','Keep going',true))hideRec();break;
    case'rp':R.people=R.people.includes(v)?R.people.filter(x=>x!==v):[...R.people,v];R.water=num($('#r_water').value);renderRec();break;
    case'guest':{const n=$('#guest').value.trim();R.water=num($('#r_water').value);if(n&&!R.people.includes(n))R.people.push(n);renderRec();break}
    case'tgt':R.targetSec=Math.max(30,R.targetSec+ +v);$('#r_tgt').textContent=fmt(R.targetSec);break;
    case'prp':R.prepSec=Math.max(5,R.prepSec+ +v);$('#r_prp').textContent=fmt(R.prepSec);break;
    case'recGo':{if(!R.people.length){toast('Pick who is going in');break}const w=waterNow();R.water=num($('#r_water').value);R.waterSrc=R.water!=null&&w&&R.water===w.v?w.src:'manual';startPrep();break}
    case'prpAdd':R.prepSec+=15;persistR();break;
    case'skipPrep':startDip();break;
    case'recStop':stopDip();break;
    case'sty':{keepWrap();const[i,st]=v.split('|');R.styles[+i]=st;renderRec();break}
    case'feel':keepWrap();R.feeling=+v;renderRec();break;
    case'recSave':saveRec();break;
    case'recDiscard':if(await confirmD('Discard this dip?','The recording will be deleted.','Discard','Keep',true))hideRec();break;
    case'resume':{const j=JSON.parse(localStorage.getItem(ACTIVE)||'null');if(!j)break;R=j;if(R.phase==='prep'){startPrep();break}if(R.phase==='dip'){lock();showRec();listen(()=>stopDip(),$('#lst'));stopTick();tick=setInterval(doTick,200);break}showRec();break}
    case'discardActive':localStorage.removeItem(ACTIVE);render();break;
  }
});
document.addEventListener('input',e=>{if(page==='settings'&&sub&&['club','dips','sheet'].includes(sub)&&e.target.closest('#main'))dirty=true;if(e.target.id==='sp_q')SP.q=e.target.value});
document.addEventListener('change',async ev=>{
  const id=ev.target.id;
  if(id==='w_photo'){const f=ev.target.files[0];if(!f)return;keepWrap();try{R.photo=await shrink(f);R.photoUrl=URL.createObjectURL(R.photo);renderRec()}catch{toast('Could not read photo')}}
  if(id==='w_logofile'||id==='c_logofile'){const f=ev.target.files[0];if(!f)return;try{const url=await blobToUrl(await shrink(f,192,'image/png'));if(id==='w_logofile'){wizRead();W.logo=url;render()}else{S.settings.club.logo=url;const n=$('#c_name').value;dirty=true;render();$('#c_name').value=n}}catch{toast('Could not read picture')}}
  if(id==='impfile'){const f=ev.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const ids=new Set(S.dips.map(d=>d.id));(j.dips||[]).forEach(d=>{if(!ids.has(d.id))S.dips.push(d)});(j.members||[]).forEach(m=>{if(!S.members.includes(m))S.members.push(m)});save();render();toast('Imported')}catch{toast('Invalid backup file')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='guest')$('[data-a=guest]').click();if(e.target.id==='sp_q')spotGeo();if(e.target.id==='newm')$('[data-a=addmember]').click();if(e.target.id==='w_newm')$('[data-a=wadd]').click()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(page==='settings'&&sub==='about')render()});
window.addEventListener('online',()=>checkUpdate());

/* ====== boot ====== */
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!S.settings.mig16){const sp=S.settings.spot;if(sp&&sp.manualNone&&!sp.lake)delete sp.manualNone;S.settings.mig16=true;save()}
if(!S.settings.setupDone){initWiz();page='setup'}
render();
if(S.settings.setupDone){if(!S.cache.fetched||Date.now()-S.cache.fetched>10*60e3)refreshData()}
loadLakes().then(()=>{if(SP&&SP.city&&(page==='setup'||page==='settings'))renderBody()});
(async()=>{await whatsNew();checkUpdate()})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(R&&(R.phase==='prep'||R.phase==='dip')){lock();doTick()}else{checkUpdate();if(S.settings.setupDone&&Date.now()-(S.cache.fetched||0)>10*60e3)refreshData()}}});
</script>
</body>
</html>
