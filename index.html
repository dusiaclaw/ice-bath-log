<html lang="en" data-theme="ice" data-mode="dark">

<title>Ice Dip Log</title>

<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--acc:#2aa6e0;--acc2:#5ad1ff;--onacc:#03202f;--red:#ff4d5e;--ok:#3fcf94;--over:#ffb454;--r:18px}
[data-theme=forest]{--acc:#2fa36b;--acc2:#5fd39a;--onacc:#03251a}
[data-theme=sunset]{--acc:#f08a3c;--acc2:#ffb26b;--onacc:#2b1503}
[data-theme=violet]{--acc:#8b6cf0;--acc2:#b3a0ff;--onacc:#150a3a}
[data-theme=rose]{--acc:#e0587a;--acc2:#ff8fa8;--onacc:#3a0a17}
[data-mode=dark]{--bg:#0c1520;--bg2:#13222f;--card:#17293a;--card2:#21394d;--ink:#eaf3fa;--mute:#93aec3;--line:#2a475f;--field:#0f1e2b;--warnbg:#3a2a10;--goodbg:#0f3a2c;color-scheme:dark}
[data-mode=light]{--bg:#eef3f7;--bg2:#e3ecf2;--card:#fff;--card2:#e8eff5;--ink:#0f2230;--mute:#587186;--line:#cfdce6;--field:#f6f9fb;--warnbg:#fff1d6;--goodbg:#dcf5ea;--acc2:var(--acc);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
h1{font-size:22px;margin:4px 0}h2{font-size:16px;margin:0 0 8px;color:var(--acc2)}p{margin:6px 0}
.sub{color:var(--mute);font-size:13px}
svg.ic{width:1.3em;height:1.3em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
#top{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:var(--bg2);border-bottom:1px solid var(--line)}
#top .t{flex:1;min-width:0}#top .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#top .t span{font-size:11px;color:var(--mute)}
#top img.logo{width:34px;height:34px;border-radius:8px;object-fit:cover}
#main{max-width:560px;margin:0 auto;padding:calc(66px + env(safe-area-inset-top)) 14px 24px}
#main.hasbar{padding-bottom:110px}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:10;display:none;gap:10px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
#bar.show{display:flex}#bar button{flex:1}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin:12px 0;box-shadow:0 1px 8px #0003}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.wrap{flex-wrap:wrap}.end{justify-content:flex-end}
.big{font-size:60px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}.big small{font-size:24px;color:var(--mute);font-weight:500}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;background:var(--card2);font-size:13px;border:1px solid transparent}
.chip.on{background:var(--acc);color:var(--onacc);border-color:var(--acc2)}.chip.mute{color:var(--mute)}
button,.btn{font:inherit;color:var(--ink);background:var(--card2);border:0;border-radius:14px;padding:12px 16px;cursor:pointer}
button:active{filter:brightness(1.2)}button:disabled{opacity:.5}
button.icon{padding:8px 10px;background:transparent;font-size:18px}
.pri{background:var(--acc);color:var(--onacc);font-weight:700}
.danger{background:var(--red);color:#fff;font-weight:700}
.ghost{background:transparent;border:1px solid var(--line)}
.wide{width:100%}.xl{font-size:20px;padding:18px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:12px;padding:11px;width:100%}
input[type=checkbox]{width:auto}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}label.row{color:var(--ink);font-size:15px}
.warn{background:var(--warnbg);border-left:4px solid var(--over);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.good{background:var(--goodbg);border-left:4px solid var(--ok);padding:8px 10px;border-radius:8px;margin:6px 0;font-size:14px}
.hours{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.hr{min-width:58px;text-align:center;background:var(--card2);border-radius:12px;padding:8px 4px;font-size:13px}.hr b{display:block;font-size:16px}.hr.best{outline:2px solid var(--ok)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 4px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:500}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:var(--card2);border-radius:14px;padding:10px}.stat b{font-size:22px;display:block}
.hb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:18px 8px;font-weight:600}.hb .ic{font-size:30px;color:var(--acc2)}
.dip{border-top:1px solid var(--line);padding:10px 0}.dip img{width:64px;height:64px;object-fit:cover;border-radius:10px}
pre{background:var(--field);border-radius:10px;padding:10px;font-size:11px;overflow:auto;max-height:220px;white-space:pre-wrap}
.seg{display:flex;background:var(--field);border-radius:12px;overflow:hidden;border:1px solid var(--line)}.seg button{flex:1;border-radius:0;background:none;padding:9px;font-size:14px}.seg button.on{background:var(--acc);color:var(--onacc);font-weight:600}
.mi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);margin:8px 0;padding:14px;border-radius:14px}.mi .ic{color:var(--acc2);font-size:22px}.mi span{flex:1}
.pcard{background:var(--card2);border-radius:14px;padding:10px;margin:8px 0}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid transparent;padding:0}.sw.on{border-color:var(--ink)}
.logo-lg{width:84px;height:84px;border-radius:18px;object-fit:cover;background:var(--card2)}
.pick{display:block;width:100%;text-align:left;margin:6px 0;background:var(--card2)}.pick.on{outline:2px solid var(--acc)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:99px;z-index:60;font-size:14px;max-width:90%}
#dlg{position:fixed;inset:0;background:#0009;z-index:50;display:none;align-items:flex-end;justify-content:center}#dlg.show{display:flex}
.sheet{background:var(--bg2);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h2{font-size:18px;color:var(--ink)}.sb{margin:8px 0 14px}.sb ul{padding-left:18px;margin:4px 0}
#menu{position:fixed;top:calc(56px + env(safe-area-inset-top));right:10px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;z-index:40;display:none;min-width:190px;box-shadow:0 8px 24px #0006;overflow:hidden}#menu.show{display:block}
#menu button{display:flex;gap:10px;align-items:center;width:100%;background:none;border-radius:0;text-align:left}
/* recording overlay */
#rec{--bg:#04182a;--bg2:#0a2a4a;--card:#102a43;--card2:#1d3d5c;--ink:#eaf6ff;--mute:#8fb0c9;--line:#2a475f;--field:#0a1f33;position:fixed;inset:0;background:var(--bg);color:var(--ink);z-index:30;display:none;flex-direction:column}
#rec.show{display:flex}#rec.prep{background:#0a2a4a}#rec.dip{background:#04182a}#rec.dip.over{background:#2a1a04}
.rb{flex:1;overflow:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 14px;display:flex;flex-direction:column}
.rf{padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;background:#0006}.rf button{flex:1}
.timer{font-size:min(30vw,26vh);font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1;letter-spacing:-2px}
.over .timer{color:var(--over)}
.phase{text-align:center;font-size:22px;font-weight:700;color:var(--acc2);margin-top:6px}.over .phase{color:var(--over)}
.mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px}
.stopbtn{height:28vh;font-size:12vw;font-weight:800;margin:0 12px calc(12px + env(safe-area-inset-bottom));border-radius:22px}
.listen{text-align:center;color:var(--mute);font-size:14px;min-height:20px}
.step{display:flex;gap:8px;align-items:center}.step button{width:48px;padding:10px}.step b{flex:1;text-align:center;font-size:20px}
.wzdots{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}.wzdots i{width:26px;height:5px;border-radius:3px;background:var(--card2)}.wzdots i.on{background:var(--acc)}
</style>
</head>

const km=(a,b,c,d)=>{const R=6371,t=x=>x*Math.PI/180,dl=t(c-a),dn=t(d-b),h=Math.sin(dl/2)**2+Math.cos(t(a))*Math.cos(t(c))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const dest=(la,ln,m,b)=>{const R=6371000,t=x=>x*Math.PI/180,d=m/R,B=t(b),p=t(la),l=t(ln);const p2=Math.asin(Math.sin(p)*Math.cos(d)+Math.cos(p)*Math.sin(d)*Math.cos(B));const l2=l+Math.atan2(Math.sin(B)*Math.sin(d)*Math.cos(p),Math.cos(d)-Math.sin(p)*Math.sin(p2));return[p2*180/Math.PI,l2*180/Math.PI]};

function parseAlp(j){
  const raw=j.variables.temperature.data.map(x=>Array.isArray(x)?x.flat(Infinity)[0]:x);
  const ts=j.time.map(t=>+new Date(/Z|[+-]\d\d:?\d\d$/.test(t)?t:t+'Z'));
  return ts.map((t,i)=>({t,v:raw[i]})).filter(p=>typeof p.v==='number'&&isFinite(p.v));
}
async function alpPoint(lake,lat,lng,a,b){
  for(const key of lake.keys){
    for(const q of ['?variables=temperature','']){
      try{const r=await fetch(`https://alplakes-api.eawag.ch/simulations/point/${lake.model}/${key}/${a}/${b}/0/${lat.toFixed(5)}/${lng.toFixed(5)}${q}`);
        if(!r.ok)continue;const s=parseAlp(await r.json());if(s.length)return{series:s,key}}catch{}
    }
  }
  return null;
}
const tfmt=d=>d.toISOString().slice(0,16).replace(/[-:T]/g,'');
async function findLakePoint(city,lake,onProg){
  const c=[[city.lat,city.lng]];
  for(const r of [150,400,800,1500,3000,5000])for(let b=0;b<360;b+=45)c.push(dest(city.lat,city.lng,r,b));
  for(let f=.1;f<=1.001;f+=.1)c.push([city.lat+(lake.lat-city.lat)*f,city.lng+(lake.lng-city.lng)*f]);
  c.sort((p,q)=>km(city.lat,city.lng,p[0],p[1])-km(city.lat,city.lng,q[0],q[1]));
  const now=Date.now(),a=tfmt(new Date(now-36e5)),b=tfmt(new Date(now+36e5));
  for(let i=0;i<c.length;i+=8){
    onProg&&onProg(i,c.length);
    const batch=c.slice(i,i+8),res=await Promise.all(batch.map(p=>alpPoint(lake,p[0],p[1],a,b)));
    const k=res.findIndex(Boolean);if(k>=0)return{pt:batch[k],key:res[k].key,dist:km(city.lat,city.lng,batch[k][0],batch[k][1])};
  }
  return null;
}
let stationCache=null;
async function nearestStation(lat,lng){
  try{
    if(!stationCache){const r=await fetch('https://api.existenz.ch/apiv1/hydro/locations');stationCache=(await r.json()).payload}
    let best=null;for(const k in stationCache){const d=stationCache[k].details||{};if(d['water-body-type']!=='lake'||d.lat==null)continue;const dd=km(lat,lng,+d.lat,+d.lon);if(dd<40&&(!best||dd<best.dist))best={id:String(d.id??k),name:d.name,dist:Math.round(dd)}}
    return best;
  }catch{return null}
}

async function fetchAlp(){
  const sp=S.settings.spot;if(!sp||!sp.lake||!sp.pt)throw new Error('no lake model set');
  const now=Date.now(),r=await alpPoint({keys:[sp.lake.key],model:sp.lake.model},sp.pt[0],sp.pt[1],tfmt(new Date(now-6*36e5)),tfmt(new Date(now+48*36e5)));
  if(!r)throw new Error('no model data');
  let cur=r.series[0];for(const p of r.series)if(Math.abs(p.t-now)<Math.abs(cur.t-now))cur=p;
  return{v:+cur.v.toFixed(1),t:cur.t,series:r.series.filter(p=>p.t>now-36e5).slice(0,60)};
}
async function fetchBafu(){
  const st=S.settings.spot&&S.settings.spot.station;if(!st)throw new Error('no station set');
  const r=await fetch(`https://api.existenz.ch/apiv1/hydro/latest?locations=${encodeURIComponent(st.id)}&parameters=temperature&app=ice-dip-log&version=1.0`);
  if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
  const p=(j.payload||[]).filter(x=>x.par==='temperature'&&x.val!=null).pop();if(!p)throw new Error('no temperature');
  return{v:+(+p.val).toFixed(1),t:p.timestamp*1000};
}
async function fetchWx(){
  const sp=S.settings.spot;if(!sp)throw new Error('no location set');
  const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${sp.lat}&longitude=${sp.lng}&current=temperature_2m,apparent_temperature,wind_speed_10m,weather_code,is_day&hourly=temperature_2m,apparent_temperature,precipitation_probability,weather_code,wind_speed_10m&timezone=auto&forecast_days=2&wind_speed_unit=kmh`);
  if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json(),h=j.hourly;
  return{t:Date.now(),air:j.current.temperature_2m,feels:j.current.apparent_temperature,wind:j.current.wind_speed_10m,code:j.current.weather_code,day:j.current.is_day,
    hours:h.time.map((t,i)=>({t:+new Date(t),air:h.temperature_2m[i],feels:h.apparent_temperature[i],pop:h.precipitation_probability[i],code:h.weather_code[i],wind:h.wind_speed_10m[i]}))};
}
const wxIcon=c=>c==null?'·':c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';

function waterNow(){
  const m=S.manual;if(m&&Date.now()-m.t<6*36e5)return{v:m.v,src:'Your measurement',t:m.t};
  const {alp,bafu}=S.cache;const A=alp&&{v:alp.v,src:'Lake model',t:alp.t},B=bafu&&{v:bafu.v,src:'Measuring station',t:bafu.t};
  return A||B||null;
}

/* ====== suggestions ====== */
const recommendSec=w=>w==null?120:Math.round(Math.min(Math.max(w,1),10))*60;
function suggestion(){
  const w=waterNow(),wx=S.cache.wx,out=[];
  if(!w)return{lines:[{c:'warn',t:'No water temperature yet – refresh, or enter what you measure at the shore.'}],sec:120};
  const sec=recommendSec(w.v),min=sec/60,lvl=w.v<4?'Extreme cold':w.v<7?'Very cold':w.v<10?'Cold':w.v<14?'Fresh':'Mild';
  out.push({c:'good',t:`<b>${lvl} (${w.v.toFixed(1)}°C)</b> – aim for up to <b>${min} min</b> (rule of thumb: ~1 min per °C, max 10). `+(w.v<7?'Stay standing or swim only briefly; keep hands and head out if you can.':w.v<12?'Short swims are fine if you are acclimatised.':'Good conditions for a longer, relaxed dip.')});
  if(wx){
    if(wx.feels<3)out.push({c:'warn',t:`Feels like ${wx.feels.toFixed(0)}°C on shore – bring warm dry layers, a hat and a hot drink; get dressed fast.`});
    if(wx.wind>20)out.push({c:'warn',t:`Wind ${Math.round(wx.wind)} km/h – wind chill after you get out will hurt; shorten the dip.`});
    if(wx.code>=95)out.push({c:'warn',t:'Thunderstorm risk – stay out of the water.'});
    else if(wx.code>=51&&wx.code<=82)out.push({c:'warn',t:'Rain/snow around – plan a sheltered place to change.'});
    if(!wx.day)out.push({c:'warn',t:'It is dark – use a headlamp, bring a buddy, stay close to the shore.'});
    const b=bestHour();if(b)out.push({c:'good',t:`Best slot ${b.today?'today':'tomorrow'}: <b>${pad(new Date(b.t).getHours())}:00</b> – feels like ${b.feels.toFixed(0)}°C, ${wxIcon(b.code)} ${b.pop??0}% rain chance.`});
  }
  out.push({c:'warn',t:'Never dip alone. Leave the water if you shiver uncontrollably or lose feeling in hands. Rewarm gradually (no hot shower right away). Not medical advice.'});
  return{lines:out,sec};
}
function bestHour(){
  const h=S.cache.wx?.hours;if(!h)return null;const now=Date.now(),d=new Date();
  const ok=x=>{const hr=new Date(x.t).getHours();return hr>=8&&hr<=17&&x.code<95&&(x.pop??0)<60};
  let c=h.filter(x=>x.t>now-36e5&&new Date(x.t).getDate()===d.getDate()&&ok(x)),today=true;
  if(!c.length){c=h.filter(x=>x.t>now&&ok(x));today=false}
  if(!c.length)return null;c.sort((a,b)=>b.feels-a.feels);return{...c[0],today};
}

function chart(d){
  if(!d.length)return '';const W=340,H=150,L=8,B=22,T=10,n=d.length,bw=Math.max(4,Math.min(26,(W-2*L)/n-3));

  const x=i=>L+(i+.5)*((W-2*L)/n),yb=s=>H-B-(s/mx)*(H-B-T),yw=w=>H-B-((w-lo)/(hi-lo))*(H-B-T);
  const bars=d.map((q,i)=>`<rect x="${x(i)-bw/2}" y="${yb(q.sec)}" width="${bw}" height="${H-B-yb(q.sec)}" rx="2" fill="var(--acc)" opacity=".75"/>`).join('');

  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Dips chart">${bars}${line}<text x="${L}" y="${H-6}" fill="var(--mute)" font-size="10">${fmtDate(d[0].ts)}</text><text x="${W-L}" y="${H-6}" fill="var(--mute)" font-size="10" text-anchor="end">${fmtDate(d[n-1].ts)}</text><text x="${L}" y="${T}" fill="var(--mute)" font-size="10">${Math.round(mx/60)} min</text></svg>`;
}

function go(p,s=null){page=p;sub=s;dirty=false;menuOpen=false;if(p==='setup'&&!W)initWiz();if(p==='settings'&&s==='spot')initSpot(S.settings.spot);render();window.scrollTo(0,0)}
async function back(){
  if(dirty&&!(await confirmD('Discard changes?','You changed something that is not saved yet.','Discard','Keep editing',true)))return;
  if(page==='settings'&&sub)go('settings');else go('home');
}
const TITLES={home:'',cond:'Conditions',stats:'Statistics',hist:'History',settings:'Settings'};
const SUBT={club:'Club',spot:'Swimming spot',members:'Members',dips:'Dip defaults',sheet:'Shared Sheet',look:'Appearance',backup:'Backup & data',about:'About'};
function renderTop(){
  const home=page==='home'||page==='setup',title=page==='setup'?APP_NAME:page==='settings'&&sub?SUBT[sub]:home?clubName():TITLES[page];
  $('#top').innerHTML=`${home?(S.settings.club.logo?`<img class="logo" src="${S.settings.club.logo}" alt="">`:`<span style="font-size:26px;color:var(--acc2)">${ic('snowflake')}</span>`):`<button class="icon" data-a="back" aria-label="Back">${ic('arrow-left')}</button>`}
   <div class="t"><b>${esc(title)}</b><span>${APP_NAME} v${APP_VERSION}${newer?' → v'+esc(newer.version):''}</span></div>
   ${newer?`<button class="icon" data-a="updatepop" aria-label="Update available" style="color:var(--over)">${ic('refresh')}</button>`:''}
   ${page==='setup'?'':`<button class="icon" data-a="menu" aria-label="Menu">${ic('menu-2')}</button>`}`;
  const m=$('#menu');m.className=menuOpen?'show':'';
  m.innerHTML=[['home','home','Home'],['cond','thermometer','Conditions'],['stats','chart-bar','Statistics'],['hist','history','History'],['settings','settings','Settings']].map(([k,i,l])=>`<button data-a="go" data-v="${k}">${ic(i)} ${l}</button>`).join('');
}
function render(){
  applyTheme();renderTop();const m=$('#main'),bar=$('#bar');let b='';
  const formPage=page==='settings'&&['club','spot','dips','sheet'].includes(sub);
  if(page==='setup'){m.innerHTML=wizHtml();b=wizBar()}
  else if(page==='home')m.innerHTML=homeHtml();
  else if(page==='cond')m.innerHTML=condHtml();
  else if(page==='stats')m.innerHTML=statsHtml();
  else if(page==='hist')m.innerHTML=historyHtml();
  else if(page==='settings')m.innerHTML=settingsHtml();
  if(formPage)b=`<button class="ghost" data-a="back">Back</button><button class="pri" data-a="savepage">${ic('device-floppy')} Save</button>`;
  bar.innerHTML=b;bar.className=b?'show':'';m.className=b?'hasbar':'';
  if(page==='hist')loadPhotos();
}

function homeHtml(){

  return `${unfinished?`<div class="warn">Unfinished dip found. <button data-a="resume">Resume</button> <button class="ghost" data-a="discardActive">Discard</button></div>`:''}
  <div class="card" data-a="go" data-v="cond" style="cursor:pointer"><div class="row sp"><div><div class="sub">Water${sp?' · '+esc(sp.city):''}</div><div class="big">${w?w.v.toFixed(1):'–'}<small>°C</small></div><div class="sub">${w?esc(w.src)+' · '+ago(w.t):'tap to set up or enter a value'}</div></div>
   <div style="text-align:right"><div style="font-size:38px">${wx?wxIcon(wx.code):''}</div><div style="font-size:22px;font-weight:600">${wx?wx.air.toFixed(0)+'°C':''}</div><div class="sub">${wx?'feels '+wx.feels.toFixed(0)+'°':''}</div></div></div></div>

   <button class="hb" data-a="go" data-v="stats">${ic('chart-bar')}Statistics</button>

function condHtml(){
  const w=waterNow(),c=S.cache,wx=c.wx,sg=suggestion(),sp=S.settings.spot;
  return `<div class="row sp"><div class="sub">${sp?ic('map-pin')+' '+esc(sp.city)+(sp.lake?' · '+esc(sp.lake.name):''):'No swimming spot set'}</div><button data-a="refresh" ${loading?'disabled':''}>${loading?'…':ic('refresh')}</button></div>
  ${!sp?`<div class="warn">Set your city and lake in <a href="#" data-a="gospot" style="color:var(--acc2)">Settings › Swimming spot</a>.</div>`:''}
  <div class="card"><div class="sub">Water</div><div class="big">${w?w.v.toFixed(1):'–'}<small>°C</small></div>
   <div class="sub">${w?esc(w.src)+' · '+ago(w.t):'no data'}</div>
   <div class="row wrap" style="margin-top:8px">${c.alp?`<span class="chip">Lake model ${c.alp.v.toFixed(1)}°</span>`:''}${c.bafu?`<span class="chip">Station ${esc(sp.station.name)} ${c.bafu.v.toFixed(1)}° (${sp.station.dist} km)</span>`:''}${c.errors&&c.errors.alp&&sp&&sp.lake?`<span class="chip mute">Model: ${esc(c.errors.alp)}</span>`:''}${c.errors&&c.errors.bafu&&sp&&sp.station?`<span class="chip mute">Station: ${esc(c.errors.bafu)}</span>`:''}</div>
   <div class="row" style="margin-top:10px"><input id="man" inputmode="decimal" placeholder="Measured at shore, °C" style="flex:1"><button data-a="manual">Set</button>${S.manual?`<button class="ghost" data-a="manualClear">${ic('x')}</button>`:''}</div>
   ${c.alp&&c.alp.series.length?`<div class="sub" style="margin-top:8px">Model forecast: ${forecastTxt(c.alp.series)}</div>`:''}</div>
  <div class="card"><div class="row sp"><div><div class="sub">Air</div><div class="big" style="font-size:44px">${wx?wx.air.toFixed(1):'–'}<small>°C</small></div></div><div style="font-size:40px">${wx?wxIcon(wx.code):''}</div></div>
   <div class="sub">${wx?`Feels like ${wx.feels.toFixed(0)}° · wind ${Math.round(wx.wind)} km/h · ${ago(wx.t)}`:(c.errors&&c.errors.wx?'Weather: '+esc(c.errors.wx):'no data')}</div>${wx?hoursHtml(wx):''}</div>
  <div class="card"><h2>Today’s dip</h2>${sg.lines.map(l=>`<div class="${l.c}">${l.t}</div>`).join('')}</div>

function forecastTxt(s){const now=Date.now();const pick=h=>{const t=now+h*36e5;return s.reduce((a,p)=>Math.abs(p.t-t)<Math.abs(a.t-t)?p:a)};return [6,24,48].map(h=>`+${h}h ${pick(h).v.toFixed(1)}°`).join(' · ')}
function hoursHtml(wx){const now=Date.now(),b=bestHour();return `<div class="hours" style="margin-top:10px">${wx.hours.filter(h=>h.t>now-36e5).slice(0,12).map(h=>`<div class="hr ${b&&b.t===h.t?'best':''}">${pad(new Date(h.t).getHours())}h<b>${h.feels.toFixed(0)}°</b>${wxIcon(h.code)}<br><span class="sub">${h.pop??0}%</span></div>`).join('')}</div>`}

/* ====== spot picker (shared by setup and settings) ====== */
let SP=null;
function initSpot(spot){SP={q:spot?spot.city:'',results:null,city:spot?{name:spot.city,region:spot.region,country:spot.country,lat:spot.lat,lng:spot.lng}:null,lake:spot&&spot.lake?LAKES.find(l=>l.name===spot.lake.name):null,none:!!(spot&&!spot.lake),busy:'',msg:spot?'Current setting kept – search again to change it.':'',result:spot||null,err:''}}
function spotHtml(){
  const s=SP,lakes=s.city?[...LAKES].map(l=>({...l,d:Math.round(km(s.city.lat,s.city.lng,l.lat,l.lng))})).sort((a,b)=>a.d-b.d):[];
  return `<label style="margin-top:0">City or town near your swimming spot</label>
  <div class="row"><input id="sp_q" value="${esc(s.q)}" placeholder="e.g. a town on the lake" style="flex:1" autocomplete="off"><button class="pri" data-a="geo">${ic('search')}</button></div>
  ${s.busy==='geo'?'<div class="sub" style="margin-top:8px">Searching…</div>':''}${s.err?`<div class="warn">${esc(s.err)}</div>`:''}
  ${s.results&&!s.results.length?'<div class="warn">No place found – try another spelling.</div>':''}
  ${s.results&&s.results.length?`<div>${s.results.map((r,i)=>`<button class="pick" data-a="pickcity" data-v="${i}">${ic('map-pin')} <b>${esc(r.name)}</b> <span class="sub">${esc([r.region,r.country].filter(Boolean).join(', '))}</span></button>`).join('')}</div>`:''}
  ${s.city&&!s.results?`<div class="good" style="margin-top:10px">${ic('map-pin')} ${esc(s.city.name)}${s.city.region?', '+esc(s.city.region):''}${s.city.country?', '+esc(s.city.country):''}</div>`:''}
  ${s.city?`<label>Lake (water-temperature model)</label>
   ${lakes.slice(0,6).map((l,i)=>`<button class="pick ${s.lake&&s.lake.name===l.name?'on':''}" data-a="picklake" data-v="${LAKES.indexOf(LAKES.find(x=>x.name===l.name))}">${esc(l.name)} <span class="sub">· ${l.d} km away</span></button>`).join('')}
   <button class="pick ${s.none?'on':''}" data-a="picklake" data-v="-1">My lake is not listed – I will enter temperatures by hand</button>
   ${s.busy==='lake'?'<div class="sub" style="margin-top:8px">Looking for model data near your spot… (can take ~20 s)</div>':''}${s.msg?`<div class="${/found|kept|hand/i.test(s.msg)?'good':'warn'}" style="margin-top:8px">${esc(s.msg)}</div>`:''}`:''}
  <div class="sub" style="margin-top:10px">Water data comes from lake models of the Swiss Alplakes project; a nearby measuring station is added if one exists. Weather is found from the city. Everything can be overridden by hand on the Conditions page.</div>`;
}
async function spotGeo(){
  SP.q=$('#sp_q').value.trim();if(SP.q.length<2)return;SP.busy='geo';SP.err='';SP.results=null;SP.city=null;renderBody();
  try{SP.results=await geocode(SP.q)}catch{SP.err='Search failed – check your internet connection.';SP.results=null}
  SP.busy='';renderBody();
}
async function spotPickCity(i){SP.city=SP.results[i];SP.results=null;SP.lake=null;SP.none=false;SP.msg='';SP.result=null;renderBody();const near=LAKES.map(l=>({l,d:km(SP.city.lat,SP.city.lng,l.lat,l.lng)})).sort((a,b)=>a.d-b.d)[0];if(near&&near.d<60)spotPickLake(LAKES.indexOf(near.l))}
async function spotPickLake(i){
  const c=SP.city;SP.msg='';
  if(i<0){SP.lake=null;SP.none=true;const st=await nearestStation(c.lat,c.lng);SP.result={city:c.name,region:c.region,country:c.country,lat:c.lat,lng:c.lng,lake:null,pt:null,station:st};SP.msg='OK – you can enter temperatures by hand'+(st?`; station “${st.name}” (${st.dist} km) will be tried too.`:'.');renderBody();return}
  SP.lake=LAKES[i];SP.none=false;SP.busy='lake';SP.result=null;renderBody();
  const f=await findLakePoint(c,SP.lake);const st=await nearestStation(c.lat,c.lng);
  SP.busy='';
  if(f){SP.result={city:c.name,region:c.region,country:c.country,lat:c.lat,lng:c.lng,lake:{name:SP.lake.name,key:f.key,model:SP.lake.model},pt:f.pt,dist:f.dist,station:st};SP.msg=`Model data found ${f.dist<1?'right at':Math.round(f.dist*10)/10+' km from'} your city.`+(st?` Station “${st.name}” (${st.dist} km) added.`:'')}
  else{SP.result={city:c.name,region:c.region,country:c.country,lat:c.lat,lng:c.lng,lake:null,pt:null,station:st};SP.msg='No model data near your city for this lake. Pick another lake or enter temperatures by hand.'}
  renderBody();
}
function renderBody(){const m=$('#main');const y=window.scrollY;if(page==='setup')m.innerHTML=wizHtml();else if(page==='settings')m.innerHTML=settingsHtml();window.scrollTo(0,y)}

let W=null;
function initWiz(){W={step:0,name:S.settings.club.name||'',logo:S.settings.club.logo||'',me:S.settings.me||'',members:[...S.members]};initSpot(null)}
const WSTEPS=3;
function wizHtml(){
  const dots=`<div class="wzdots">${[0,1,2].map(i=>`<i class="${i<=W.step?'on':''}"></i>`).join('')}</div>`;
  if(W.step===0)return `${dots}<h1>Welcome 👋</h1><p class="sub">Let’s set up your club. This takes a minute, and everything can be changed later in Settings.</p>
   <div class="card"><label style="margin-top:0">Club name</label><input id="w_name" value="${esc(W.name)}" placeholder="e.g. Ice Bath Club" maxlength="40">
   <label>Club logo (optional)</label><div class="row"><img class="logo-lg" id="w_logo" ${W.logo?`src="${W.logo}"`:'style="visibility:hidden"'} alt=""><label class="btn" style="margin:0;color:var(--ink)">${ic('photo')} Choose picture<input id="w_logofile" type="file" accept="image/*" hidden></label></div></div>`;
  if(W.step===1)return `${dots}<h1>Where do you swim?</h1><div class="card">${spotHtml()}</div>`;
  return `${dots}<h1>Who is in the club?</h1><div class="card"><label style="margin-top:0">Your name</label><input id="w_me" value="${esc(W.me)}" placeholder="Your name" maxlength="30">
   <label>Other members (optional)</label><div class="row"><input id="w_newm" placeholder="Add a member" style="flex:1" maxlength="30"><button class="pri" data-a="wadd">${ic('plus')}</button></div>
   <div class="row wrap" style="margin-top:10px">${W.members.filter(m=>m!==W.me).map(m=>`<span class="chip">${esc(m)} <a href="#" data-a="wdel" data-v="${esc(m)}" style="color:inherit;text-decoration:none"> ✕</a></span>`).join('')||'<span class="sub">You can add members later in Settings.</span>'}</div></div>`;
}
const wizBar=()=>`<button class="ghost" data-a="wback" ${W.step===0?'disabled':''}>Back</button><button class="pri" data-a="wnext">${W.step===WSTEPS-1?'Finish':'Next'}</button>`;
function wizRead(){if($('#w_name'))W.name=$('#w_name').value.trim();if($('#w_me'))W.me=$('#w_me').value.trim()}
async function wizNext(){
  wizRead();
  if(W.step===0&&!W.name){toast('Please enter a club name');return}
  if(W.step===1){
    if(!SP.result){if(!(await confirmD('No spot set','Continue without a swimming spot? Temperatures and weather stay empty until you set it in Settings.','Continue','Go back')))return}
  }
  if(W.step<WSTEPS-1){W.step++;render();window.scrollTo(0,0);return}
  if(!W.me){toast('Please enter your name');return}
  const me=W.me;W.members=[me,...W.members.filter(m=>m!==me)];
  S.settings.club={name:W.name,logo:W.logo};S.settings.spot=SP.result||null;S.members=W.members;S.settings.me=me;S.settings.setupDone=true;S.settings.lastSeen=APP_VERSION;save();W=null;SP=null;
  go('home');refreshData();
}

/* ====== settings pages ====== */
const APPS_SCRIPT=`const SHEET='Dips';
const HEAD=['key','dipId','timestamp','date','time','name','seconds','style','waterC','airC','feeling','notes','recordedBy'];
function sh_(){const ss=SpreadsheetApp.getActiveSpreadsheet();let s=ss.getSheetByName(SHEET);if(!s){s=ss.insertSheet(SHEET);s.appendRow(HEAD);s.setFrozenRows(1);}return s;}
function out_(o){return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);}
function doPost(e){
  const lock=LockService.getScriptLock();lock.waitLock(20000);
  try{
    const rows=JSON.parse(e.postData.contents).rows||[];
    const s=sh_();const last=s.getLastRow();
    const have=new Set(last>1?s.getRange(2,1,last-1,1).getValues().map(r=>String(r[0])):[]);
    const add=rows.filter(r=>!have.has(String(r.key))).map(r=>HEAD.map(h=>r[h]===undefined?'':r[h]));
    if(add.length)s.getRange(last+1,1,add.length,HEAD.length).setValues(add);
    return out_({ok:true,added:add.length});
  }finally{lock.releaseLock();}
}
function doGet(e){
  const v=sh_().getDataRange().getValues();const h=v.shift();
  return out_({ok:true,rows:v.map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])))});
}`;

   <button style="margin-top:12px" data-a="testvoice">${ic('microphone')} Test keyword</button><div class="sub" id="vtest" style="margin-top:6px"></div></div>`;

  if(sub==='backup')return `<div class="card"><h2>Backup</h2><div class="row wrap"><button data-a="csv">${ic('download')} Export CSV</button><button data-a="json">${ic('download')} Backup JSON</button><button data-a="import">${ic('upload')} Import JSON</button></div><input type="file" id="impfile" accept="application/json" hidden><div class="sub" style="margin-top:8px">The backup contains dips, members and settings (not photos).</div></div>

let ac;
function beep(f=880,d=.15){if(!S.settings.beep)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.6,ac.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.start();o.stop(ac.currentTime+d+.02)}catch{}}
function say(t){if(!S.settings.voice||!window.speechSynthesis)return;try{const u=new SpeechSynthesisUtterance(t);u.lang=S.settings.lang;speechSynthesis.speak(u)}catch{}}
let recog=null,listening=false,onHeard=null;
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const kwList=()=>S.settings.keywords.toLowerCase().split(',').map(s=>s.trim()).filter(Boolean);
function matchKw(txt){txt=txt.toLowerCase();const toks=txt.split(/[^a-zäöüéèàß]+/).filter(Boolean);return kwList().some(k=>k.includes(' ')?txt.includes(k):toks.includes(k))}
function listen(cb,el){
  if(!SR){if(el)el.textContent='⚠️ Voice recognition not supported – use the STOP button';return false}
  stopListen();listening=true;onHeard=cb;
  const start=()=>{recog=new SR();recog.lang=S.settings.lang;recog.continuous=true;recog.interimResults=true;recog.maxAlternatives=3;
    recog.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)for(let j=0;j<e.results[i].length;j++){const t=e.results[i][j].transcript;if(el)el.textContent='🎙 heard: “'+t.trim().slice(-30)+'”';if(listening&&matchKw(t)){onHeard&&onHeard(t);return}}};
    recog.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){listening=false;if(el)el.textContent='⚠️ Microphone blocked – allow it in Chrome site settings, or use the STOP button'}};
    recog.onend=()=>{if(listening)setTimeout(()=>{try{start()}catch{}},120)};
    try{recog.start();if(el&&!el.textContent)el.textContent='🎙 listening for “'+kwList().join('” / “')+'”'}catch{}};
  start();return true;
}
function stopListen(){listening=false;onHeard=null;try{recog&&(recog.onend=null,recog.abort())}catch{}recog=null}
let wake=null;
async function lock(){try{wake=await navigator.wakeLock.request('screen')}catch{}}

function startPrep(){
  R.phase='prep';R.prepStart=Date.now();persistR();ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume&&ac.resume();lock();showRec();cueMark=null;say('Get in position');
  stopTick();tick=setInterval(doTick,200);doTick();
}
function startDip(){
  R.phase='dip';R.dipStart=Date.now();R.targetHit=false;persistR();showRec();cueMark=null;beep(1200,.5);say('Go');
  const st=$('#lst');setTimeout(()=>{if(R&&R.phase==='dip')listen(()=>stopDip(),st)},1500);
  stopTick();tick=setInterval(doTick,200);doTick();
}
function doTick(){
  if(!R)return;const tm=$('#tm');if(!tm)return;const now=Date.now();
  if(R.phase==='prep'){
    const rem=R.prepSec-(now-R.prepStart)/1000;if(rem<=0){startDip();return}
    const c=Math.ceil(rem);tm.textContent=fmt(c);
    if(cueMark!==c){cueMark=c;if(c<=5)beep(c<=1?1000:700,.12);if(c===10||c===30)say(String(c))}
  }else if(R.phase==='dip'){
    const el=(now-R.dipStart)/1000,over=el>=R.targetSec;
    recEl().classList.toggle('over',over);tm.textContent=over?'+'+fmt(el-R.targetSec):fmt(R.targetSec-el+.999);
    const ph=$('#ph');if(ph)ph.textContent=over?'Overtime – stay as long as you want':'In the water';
    const tot=$('#tot');if(tot)tot.textContent='Total '+fmt(el);
    if(over&&!R.targetHit){R.targetHit=true;beep(1000,.6);say('Target reached')}
    const left=Math.ceil(R.targetSec-el);if(!over&&cueMark!==left){cueMark=left;if(left===10||left===5)beep(800,.1)}
  }
}

    case'tgt':R.targetSec=Math.max(30,R.targetSec+ +v);$('#r_tgt').textContent=fmt(R.targetSec);break;
    case'prp':R.prepSec=Math.max(5,R.prepSec+ +v);$('#r_prp').textContent=fmt(R.prepSec);break;
    case'recGo':{if(!R.people.length){toast('Pick who is going in');break}const w=waterNow();R.water=num($('#r_water').value);R.waterSrc=R.water!=null&&w&&R.water===w.v?w.src:'manual';startPrep();break}
    case'prpAdd':R.prepSec+=15;persistR();break;
    case'skipPrep':startDip();break;
    case'recStop':stopDip();break;
    case'sty':{keepWrap();const[i,st]=v.split('|');R.styles[+i]=st;wrapHtml();break}
    case'feel':keepWrap();R.feeling=+v;wrapHtml();break;
    case'recSave':saveRec();break;
    case'recDiscard':if(await confirmD('Discard this dip?','The recording will be deleted.','Discard','Keep',true))hideRec();break;
    case'resume':{const j=JSON.parse(localStorage.getItem(ACTIVE)||'null');if(!j)break;R=j;if(R.phase==='prep'){startPrep();break}if(R.phase==='dip'){lock();showRec();listen(()=>stopDip(),$('#lst'));stopTick();tick=setInterval(doTick,200);break}showRec();break}
    case'discardActive':localStorage.removeItem(ACTIVE);render();break;
  }
});
document.addEventListener('input',e=>{if(page==='settings'&&sub&&['club','dips','sheet'].includes(sub)&&e.target.closest('#main'))dirty=true;if(e.target.id==='sp_q')SP.q=e.target.value});
document.addEventListener('change',async ev=>{
  const id=ev.target.id;
  if(id==='w_photo'){const f=ev.target.files[0];if(!f)return;keepWrap();try{R.photo=await shrink(f);R.photoUrl=URL.createObjectURL(R.photo);wrapHtml()}catch{toast('Could not read photo')}}
  if(id==='w_logofile'||id==='c_logofile'){const f=ev.target.files[0];if(!f)return;try{const url=await blobToUrl(await shrink(f,192,'image/png'));if(id==='w_logofile'){wizRead();W.logo=url;render()}else{S.settings.club.logo=url;const n=$('#c_name').value;dirty=true;render();$('#c_name').value=n}}catch{toast('Could not read picture')}}
  if(id==='impfile'){const f=ev.target.files[0];if(!f)return;try{const j=JSON.parse(await f.text());const ids=new Set(S.dips.map(d=>d.id));(j.dips||[]).forEach(d=>{if(!ids.has(d.id))S.dips.push(d)});(j.members||[]).forEach(m=>{if(!S.members.includes(m))S.members.push(m)});save();render();toast('Imported')}catch{toast('Invalid backup file')}}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(e.target.id==='guest')$('[data-a=guest]').click();if(e.target.id==='sp_q')spotGeo();if(e.target.id==='newm')$('[data-a=addmember]').click();if(e.target.id==='w_newm')$('[data-a=wadd]').click()}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;if(page==='settings'&&sub==='about')render()});
window.addEventListener('online',()=>checkUpdate());

/* ====== boot ====== */
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
if(!S.settings.setupDone){initWiz();page='setup'}
render();
if(S.settings.setupDone){if(!S.cache.fetched||Date.now()-S.cache.fetched>10*60e3)refreshData()}
(async()=>{await whatsNew();checkUpdate()})();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(R&&(R.phase==='prep'||R.phase==='dip')){lock();doTick()}else{checkUpdate();if(S.settings.setupDone&&Date.now()-(S.cache.fetched||0)>10*60e3)refreshData()}}});
</script>
</body>
